<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 260px; padding: 12px; margin: 0; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      input, button { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 6px; }
      #status { margin-top: 8px; color: #555; min-height: 16px; }

  </head>
  <body>
    <h1>redhand bridge</h1>

    <p style="color:#777;font-size:11px;">Paste the pairing token printed by <code>redhand serve</code>.</p>
    <script src="dist/popup.js" type="module"></script>

</html>
