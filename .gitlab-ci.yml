# GitLab CI — mirrors .github/workflows/ci.yml for GitLab-hosted remotes.
# Runs the same gate chain: lint → typecheck → build → test → audit.

stages:
  - verify

variables:
  GIT_STRATEGY: clone

verify:
  stage: verify
  image: node:22
  before_script:
    - corepack enable 2>/dev/null || npm i -g pnpm@12
    - pnpm --version
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm typecheck
    - pnpm build
    - pnpm test
    - pnpm audit --prod
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  rules:
    - if: $CI_COMMIT_BRANCH
